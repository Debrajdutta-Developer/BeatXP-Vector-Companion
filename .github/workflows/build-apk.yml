name: Build Debug APK

on:
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project archive
        run: |
          test -f BeatXPVectorCompanion_RCSP_ACK_v1.1.zip
          unzip -q BeatXPVectorCompanion_RCSP_ACK_v1.1.zip -d .

      - name: Generate Gradle wrapper and build debug APK
        working-directory: BeatXPVectorCompanion
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatXP-Vector-Companion-debug-apk
          path: BeatXPVectorCompanion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
